<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Warmteverlies Tekentafel</title>
    <meta
      name="description"
      content="Teken je plattegrond en bereken het warmteverlies per ruimte, de afgifte van radiatoren en vloerverwarming, en welke warmtepomp past."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316353F'/%3E%3Cpath d='M7 25V11l9-5 9 5v14z' fill='none' stroke='%23E06A12' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <style>
      [hidden]:not([hidden='until-found' i]) {
        display: none !important;
      }
      img {
        max-width: 100%;
      }
      body {
        margin: 0;
      }
    </style>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          Warmteverlies Tekentafel
          <small>Plattegrond, wanddelen en transmissieverlies per ruimte</small>
        </div>
        <select class="proj" id="proj-sel" aria-label="Project"></select>
        <span class="pill" id="status">Laden…</span>
        <span class="spacer"></span>
        <span class="total" id="total"></span>
        <button class="btn" id="btn-undo" title="Ongedaan maken (Ctrl+Z)">↶ Ongedaan</button>
        <button class="btn" id="btn-redo" title="Opnieuw (Ctrl+Y)">↷</button>
      </header>
      <div class="main">
        <nav class="tools" id="tools" aria-label="Gereedschap">
          <button class="tool" data-tool="select" aria-pressed="true" title="Selecteren en verplaatsen (V)">
            <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.6L10 19z" /></svg>
            Selecteer
            <kbd>V</kbd>
          </button>
          <button class="tool" data-tool="rect" aria-pressed="false" title="Rechthoekige ruimte (R)">
            <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" /></svg>
            Rechthoek
            <kbd>R</kbd>
          </button>
          <button class="tool" data-tool="poly" aria-pressed="false" title="Vrije ruimte tekenen (P)">
            <svg viewBox="0 0 24 24">
              <path d="M4 18V6h9v5h7v7z" />
              <circle cx="4" cy="6" r="1.3" />
              <circle cx="13" cy="6" r="1.3" />
              <circle cx="20" cy="18" r="1.3" />
            </svg>
            Veelhoek
            <kbd>P</kbd>
          </button>
          <button class="tool" data-tool="split" aria-pressed="false" title="Wand splitsen in delen (S)">
            <svg viewBox="0 0 24 24">
              <path d="M3 12h7M14 12h7" />
              <path d="M12 5v14" stroke-dasharray="2 2" />
            </svg>
            Splits
            <kbd>S</kbd>
          </button>
          <button class="tool" data-tool="wall" aria-pressed="false" title="Wand trekken en ruimte opdelen (W)">
            <svg viewBox="0 0 24 24">
              <rect x="4" y="5" width="16" height="14" />
              <path d="M11 5v6h9" stroke-width="2.6" />
            </svg>
            Wand
            <kbd>W</kbd>
          </button>
          <span class="sep"></span>
          <button class="tool" data-tool="emit" aria-pressed="false" title="Radiator, convector of fancoil tekenen (A)">
            <svg viewBox="0 0 24 24">
              <rect x="3.5" y="8.5" width="17" height="7" rx="1.5" />
              <path d="M8 8.5v7M12 8.5v7M16 8.5v7" />
            </svg>
            Radiator
            <kbd>A</kbd>
          </button>
          <button class="tool" data-tool="vv" aria-pressed="false" title="Vloerverwarming tekenen (H)">
            <svg viewBox="0 0 24 24"><path d="M5 5h14v3.5H5V12h14v3.5H5V19h14" /></svg>
            Vloerverw.
            <kbd>H</kbd>
          </button>
          <button class="tool" data-tool="pipe" aria-pressed="false" title="Leiding tekenen (L)">
            <svg viewBox="0 0 24 24">
              <path d="M4 8h9a3 3 0 0 1 3 3v9" stroke="#DC2626" />
              <path d="M4 13h5a2 2 0 0 1 2 2v5" stroke="#2563EB" />
            </svg>
            Leiding
            <kbd>L</kbd>
          </button>
          <button class="tool" data-tool="hp" aria-pressed="false" title="Warmtepomp plaatsen (K)">
            <svg viewBox="0 0 24 24">
              <rect x="3.5" y="6" width="17" height="12" rx="2" />
              <circle cx="9" cy="12" r="3" />
              <path d="M15 9.5h3M15 12h3M15 14.5h3" />
            </svg>
            Warmtepomp
            <kbd>K</kbd>
          </button>
          <span class="sep"></span>
          <button class="tool" id="tool-fit" title="Alles in beeld (F)">
            <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /></svg>
            Passend
            <kbd>F</kbd>
          </button>
        </nav>
        <div class="stage t-select" id="stage">
          <svg id="cv" role="img" aria-label="Plattegrond"></svg>
          <div class="floorbar" id="floorbar"></div>
          <div class="hint"><span id="hint"></span></div>
          <div class="ask" id="ask" role="dialog" aria-label="Ruimte splitsen" hidden></div>
          <div class="legend" id="legend" hidden></div>
          <div class="hud">
            <div class="scalebar" id="scalebar"></div>
            <div class="coords" id="coords">x – y –</div>
          </div>
          <div class="zoom">
            <button class="btn" id="z-3d" aria-pressed="false" title="2,5D-weergave aan of uit (D)">2,5D</button>
            <button class="btn" id="z-out" aria-label="Uitzoomen">−</button>
            <button class="btn" id="z-in" aria-label="Inzoomen">+</button>
          </div>
        </div>
        <aside class="panel">
          <div class="tabs" role="tablist" id="tabs">
            <button class="tab" role="tab" data-tab="sel" aria-selected="true">Selectie</button>
            <button class="tab" role="tab" data-tab="con" aria-selected="false">Constructies</button>
            <button class="tab" role="tab" data-tab="vent" aria-selected="false">Ventilatie</button>
            <button class="tab" role="tab" data-tab="res" aria-selected="false">Resultaten</button>
            <button class="tab" role="tab" data-tab="set" aria-selected="false">Project</button>
          </div>
          <div class="pbody" id="pbody"></div>
        </aside>
      </div>
    </div>
    <div class="toast" id="toast" hidden></div>
    <input type="file" id="file-in" accept=".json,application/json" hidden />

    <script src="js/data.js"></script>
    <script src="js/core.js"></script>
    <script src="js/geometry.js"></script>
    <script src="js/calc.js"></script>
    <script src="js/render.js"></script>
    <script src="js/interaction.js"></script>
    <script src="js/panel.js"></script>
    <script src="js/emitters.js"></script>
    <script src="js/hydraulics.js"></script>
    <script src="js/sizing.js"></script>
    <script src="js/heatpumps.js"></script>
    <script src="js/views.js"></script>
    <script src="js/io.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
