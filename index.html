/* Layout: drafting table — dark petrol header band | tool rail | plan on gridded paper card | inspector card with tabs.
   Look: architectural plan (dark walls, orange openings and dimensions) on a soft cool-to-warm wash, white rounded cards. */
:root{
  --bg:#EDF2F1; --bg-2:#F6ECE3; --surface:#FFFFFF; --surface-2:#F2F6F6; --ink:#15313A; --muted:#5B6F76;
  --line:#DCE4E4; --grid:#E8EDEB; --grid-major:#D5DDDA; --paper:#FBFAF7; --room:rgba(255,255,255,.82);
  --accent:#1D5361; --accent-ink:#FFFFFF; --accent-soft:rgba(29,83,97,.06); --accent-soft-2:rgba(29,83,97,.14);
  --heat:#E06A12; --heat-soft:rgba(224,106,18,.10); --warn:#B4441F; --ok:#2F7D4A; --glass:#7FB3BE; --under:#BCC7C6;
  --wall:#1F3B44; --hdr:#16353F; --hdr-ink:#EAF2F2; --hdr-line:rgba(234,242,242,.18);
  --seg-fabric:#E06A12; --seg-glass:#EFA45E; --seg-air:#9CB3B9; --seg-track:#E3EAEA; --c-loss:#E06A12; --c-hp:#0079B8;
  --shadow:0 1px 2px rgba(21,49,58,.05),0 10px 28px -6px rgba(21,49,58,.12); --radius:16px;
  --font-display:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --font-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E191D; --bg-2:#1B1714; --surface:#152429; --surface-2:#1B2D33; --ink:#E3EDEE; --muted:#93A7AC;
  --line:#253A40; --grid:#132227; --grid-major:#1E3238; --paper:#11201F; --room:rgba(255,255,255,.035);
  --accent:#72B9C9; --accent-ink:#0A1C21; --accent-soft:rgba(114,185,201,.08); --accent-soft-2:rgba(114,185,201,.20);
  --heat:#F39446; --heat-soft:rgba(243,148,70,.14); --warn:#F2915F; --ok:#6CC28B; --glass:#5FA3B0; --under:#344A50;
  --wall:#CFDDE0; --hdr:#0A1417; --hdr-ink:#E3EDEE; --hdr-line:rgba(227,237,238,.14);
  --seg-fabric:#F39446; --seg-glass:#F6C18A; --seg-air:#6F9099; --seg-track:#24383E; --c-loss:#DB6E22; --c-hp:#2B8FD6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -6px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E191D; --bg-2:#1B1714; --surface:#152429; --surface-2:#1B2D33; --ink:#E3EDEE; --muted:#93A7AC;
  --line:#253A40; --grid:#132227; --grid-major:#1E3238; --paper:#11201F; --room:rgba(255,255,255,.035);
  --accent:#72B9C9; --accent-ink:#0A1C21; --accent-soft:rgba(114,185,201,.08); --accent-soft-2:rgba(114,185,201,.20);
  --heat:#F39446; --heat-soft:rgba(243,148,70,.14); --warn:#F2915F; --ok:#6CC28B; --glass:#5FA3B0; --under:#344A50;
  --wall:#CFDDE0; --hdr:#0A1417; --hdr-ink:#E3EDEE; --hdr-line:rgba(227,237,238,.14);
  --seg-fabric:#F39446; --seg-glass:#F6C18A; --seg-air:#6F9099; --seg-track:#24383E; --c-loss:#DB6E22; --c-hp:#2B8FD6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -6px rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg) linear-gradient(115deg,var(--bg) 0%,var(--bg) 40%,var(--bg-2) 100%) fixed;color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:10px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0;background:var(--hdr);color:var(--hdr-ink);border-radius:var(--radius);padding:10px 14px;box-shadow:var(--shadow);border-bottom:3px solid var(--heat)}
.brand{font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-family:var(--font-body);font-weight:600;font-size:10.5px;color:var(--heat);letter-spacing:.08em;text-transform:uppercase}
.top .spacer{flex:1}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.top .pill{background:transparent;border-color:var(--hdr-line);color:var(--hdr-ink);opacity:.85}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)}
.top .pill.ok,.top .pill.warn{color:var(--hdr-ink)}
.total{font-family:var(--font-body);font-size:12px;white-space:nowrap;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px;opacity:.95}
.total b{color:var(--hdr);background:var(--heat);font-family:var(--font-mono);font-weight:600;font-size:15px;letter-spacing:0;text-transform:none;padding:3px 10px;border-radius:999px}
select.proj{max-width:240px;padding:6px 10px;border:1px solid var(--hdr-line);border-radius:10px;background:transparent;color:var(--hdr-ink);font-weight:600}
select.proj option{color:#15313A;background:#FFFFFF}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;white-space:nowrap;font-weight:500}
.top .btn{background:transparent;border-color:var(--hdr-line);color:var(--hdr-ink)}
.top .btn:hover{border-color:var(--heat)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn)}
.btn.small{padding:3px 8px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tool:focus-visible,input:focus-visible,select:focus-visible,.tab:focus-visible,.segbtn:focus-visible,.linkrow:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.main{display:grid;grid-template-columns:64px minmax(0,1fr) 390px;gap:10px;min-height:0}
.tools{display:flex;flex-direction:column;gap:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 7px;border:1px solid transparent;border-radius:12px;background:var(--surface);cursor:pointer;font-size:10.5px;font-weight:600;color:var(--muted);box-shadow:var(--shadow)}
.tool svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tool[aria-pressed="true"] svg{stroke:var(--accent-ink)}
.tool kbd{font-family:var(--font-mono);font-size:9.5px;opacity:.7}
.tools .sep{height:1px;background:var(--line);margin:4px 6px}
.stage{position:relative;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--paper);min-height:0;touch-action:none;box-shadow:var(--shadow)}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.hint{position:absolute;left:10px;top:50px;right:10px;pointer-events:none;display:flex}
.floorbar{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;pointer-events:none}
.floorbar > *{pointer-events:auto}
.floors{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;max-width:100%;overflow-x:auto}
.floors button{border:none;background:none;padding:6px 11px;cursor:pointer;font-size:12.5px;color:var(--muted);border-right:1px solid var(--line);white-space:nowrap}
.floors button:last-child{border-right:none}
.floors button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.floors button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.undbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.hint span{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:12.5px;color:var(--muted);max-width:640px}
.hud{position:absolute;left:10px;bottom:10px;display:flex;gap:10px;align-items:flex-end;pointer-events:none;flex-wrap:wrap}
.coords{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-variant-numeric:tabular-nums}
.scalebar{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.scalebar i{display:block;height:5px;border:1.5px solid var(--muted);border-top:none}
.legend{position:absolute;right:10px;bottom:52px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:7px 9px;font-size:11.5px;display:flex;flex-direction:column;gap:3px;max-width:240px;pointer-events:none}
.legend div{display:flex;gap:7px;align-items:center;min-width:0}
.legend div span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{flex:none;width:16px;height:5px;border-radius:2px;display:inline-block}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
.zoom .btn{padding:4px 9px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-height:0;min-width:0;box-shadow:var(--shadow);overflow:hidden}
.tabs{display:flex;flex:none;border-bottom:1px solid var(--line);padding:0 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;font-size:13px;border:none;background:none;padding:12px 6px 10px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:600}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--heat)}
.pbody{flex:1 1 auto;overflow:auto;padding:16px 18px 26px;display:flex;flex-direction:column;gap:18px;min-height:0}
.pbody > *{flex:none}
h2{font-family:var(--font-display);font-size:20px;font-weight:800;margin:0;letter-spacing:-.02em;text-wrap:balance}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
h3::before{content:"";width:14px;height:2px;background:var(--heat);border-radius:2px;flex:none}
.sec{display:flex;flex-direction:column;gap:8px}
.crumb{border:none;background:none;padding:0;color:var(--accent);cursor:pointer;font-size:13px;text-align:left}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
label.f .u{font-family:var(--font-mono);font-size:11px}
input.in,select.in{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font-size:13.5px;min-width:0}
input.in.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
input.title{font-family:var(--font-display);font-size:18px;font-weight:600;border:1px solid transparent;background:none;padding:2px 4px;margin-left:-5px;width:100%;border-radius:6px}
input.title:hover,input.title:focus{border-color:var(--line);background:var(--surface-2)}
.big{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
.big .kpi{display:flex;flex-direction:column}
.big .kpi b{font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kcard{border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.kcard .kh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.kcard .kh span{font-weight:600;color:var(--muted);font-size:13px}
.kcard .kh b{white-space:nowrap;font-family:var(--font-display);font-weight:800;font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.segbar{display:flex;gap:4px;height:7px}
.segbar i{display:block;border-radius:4px;min-width:3px}
.seglegend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);font-weight:600}
.seglegend span{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.seglegend span::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--c)}
.roomcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.roomcard{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:11px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.roomcard:hover{border-color:var(--heat)}
.roomcard .rn{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roomcard .rk{font-family:var(--font-display);font-size:20px;font-weight:800;letter-spacing:-.02em}
.roomcard .rs{font-size:11.5px;color:var(--muted)}
.big .kpi b.heat{color:var(--heat)}
.big .kpi span{font-size:11.5px;color:var(--muted)}
.wallbar{display:flex;height:30px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.segbtn{border:none;border-right:1px solid var(--surface);cursor:pointer;color:#fff;font-size:11px;font-family:var(--font-mono);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 4px;min-width:6px;position:relative}
.segbtn:last-child{border-right:none}
.segbtn.none{background:repeating-linear-gradient(45deg,var(--surface-2) 0 6px,var(--line) 6px 12px);color:var(--muted)}
.segbtn.cur{box-shadow:inset 0 0 0 3px var(--ink)}
.wallrow{display:flex;flex-direction:column;gap:4px}
.wallrow .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.wallrow .meta b{color:var(--ink);font-weight:500}
.scale{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
table.calc{width:100%;border-collapse:collapse;font-size:12.5px}
table.calc th{font-weight:500;color:var(--muted);font-size:11px;text-align:right;padding:4px 4px;border-bottom:1px solid var(--line)}
table.calc th:first-child,table.calc td:first-child{text-align:left}
table.calc td{padding:4px 4px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;vertical-align:top}
table.calc td:first-child{font-family:var(--font-body);min-width:0}
table.calc td small{display:block;color:var(--muted);font-size:11px}
table.calc tr.sum td{font-weight:600;border-bottom:none;color:var(--heat)}
table.calc tr.miss td{color:var(--warn)}
.tablewrap{overflow-x:auto}
.card{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.card.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > *{min-width:0}
.grow{flex:1}
.note{font-size:12.5px;color:var(--muted)}
.note a{color:var(--accent)}
.warnbox{font-size:12.5px;color:var(--warn);border:1px solid var(--warn);background:var(--heat-soft);border-radius:10px;padding:6px 9px}
.det{display:flex;flex-direction:column;gap:2px;font-size:12.5px;font-family:var(--font-mono);background:var(--surface-2);border-radius:10px;padding:7px 9px}
.linkrow{display:flex;justify-content:space-between;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.linkrow:hover{border-color:var(--accent)}
.linkrow span:last-child{font-family:var(--font-mono);color:var(--heat);white-space:nowrap}
.colorin{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer;flex:none}
.opgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.8fr) minmax(0,.8fr) auto;gap:6px;align-items:end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--hdr);color:var(--hdr-ink);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;display:flex;gap:12px;align-items:center;z-index:20;max-width:calc(100% - 32px)}
.toast button{background:none;border:none;color:var(--heat);cursor:pointer;font-weight:600;padding:0}
svg text{font-family:var(--font-mono);paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}
svg .rname{font-family:var(--font-body);font-weight:700;fill:var(--muted);letter-spacing:.09em;text-transform:uppercase}
svg .rsub{fill:var(--muted);font-family:var(--font-body);font-weight:500}
svg .rheat{fill:var(--ink);font-family:var(--font-display);font-weight:800;letter-spacing:-.02em}
svg .dim{fill:var(--heat);font-size:11px;font-weight:600}
svg .pilltxt{fill:var(--heat);font-size:10.5px;font-weight:600;stroke:none}
.hit{stroke:transparent;fill:none;cursor:pointer}
.stage.t-select .room{cursor:move}
.stage.t-poly,.stage.t-rect,.stage.t-split,.stage.t-wall{cursor:crosshair}
.ask{position:absolute;left:50%;top:96px;transform:translateX(-50%);width:min(380px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:13px;z-index:5}
.ask[hidden]{display:none}
.stage:has(.ask:not([hidden])) .hint{display:none}
.ask p{margin:0;color:var(--muted);line-height:1.45}
.stage.panning{cursor:grabbing}
.hprow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.hprow:hover{border-color:var(--c-hp)}
.hprow.cur{border-color:var(--c-hp);box-shadow:0 0 0 1px var(--c-hp)}
.hprow .hn{font-weight:700;min-width:0}
.hprow .hn small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.hprow .hk{font-family:var(--font-mono);font-weight:600;text-align:right;white-space:nowrap}
.hprow .hs{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.ok{color:var(--ok)} .chip.bad{color:var(--warn)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:none}
.chart svg text{font-family:var(--font-body);stroke:none;fill:var(--muted);font-size:10.5px}
.tip{position:absolute;pointer-events:none;background:var(--hdr);color:var(--hdr-ink);font-size:11.5px;padding:7px 10px;border-radius:9px;white-space:nowrap;font-family:var(--font-mono);transform:translate(-50%,calc(-100% - 10px));line-height:1.5;z-index:2}
.chartleg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);font-weight:600}
.chartleg span{display:inline-flex;align-items:center;gap:6px}
.chartleg i{display:inline-block;width:18px;height:3px;border-radius:2px}
.concard{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.concard.open{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.consum{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:none;background:none;cursor:pointer;text-align:left}
.consum .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.consum .val{font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.conbody{padding:0 10px 10px;display:flex;flex-direction:column;gap:9px}
label.chk{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--muted)}
.layers{display:flex;flex-direction:column;gap:4px}
.layside{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.layer{border:1px solid var(--line);border-radius:6px;padding:5px 6px;display:flex;flex-direction:column;gap:5px;background:var(--surface-2)}
.layer.ign{opacity:.55}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) 78px 58px auto;gap:5px;align-items:center}
.lmove{display:flex;flex-direction:column}
.lmove button{border:none;background:none;cursor:pointer;color:var(--muted);font-size:9px;line-height:1;padding:1px 3px}
.lmove button:disabled{opacity:.3;cursor:default}
.lrow .in{padding:4px 6px;font-size:12.5px;background:var(--surface)}
.mmwrap{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.rd{font-family:var(--font-mono);font-size:11.5px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.xbtn{border:none;background:none;cursor:pointer;color:var(--muted);padding:2px 4px}
.xbtn:disabled{opacity:.3;cursor:not-allowed}
.subrow{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap;padding-left:22px}
.subrow .in{width:auto;padding:3px 6px;font-size:12px;background:var(--surface)}
.xsec{border:1px solid var(--line);border-radius:6px;background:var(--paper);overflow:hidden}
.xsec svg{display:block;width:100%;height:auto}
.xsec svg text{font-size:10px;fill:var(--muted)}
.linkbtn{border:none;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:12px}
.matrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.matrow .in{width:auto}
@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto}
  .main{grid-template-columns:1fr;grid-template-rows:auto 62vh auto}
  .tools{flex-direction:row;overflow-x:auto}
  .tools .sep{width:1px;height:auto;margin:6px 2px}
  .tool{min-width:58px}
  .panel{max-height:none}
  .pbody{overflow:visible}
  .legend{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  try{const j=JSON.parse(document.getElementById('hp-default').textContent);hpList=hpValid(j.warmtepompen);hpSource='standaard';}
  catch(_){hpList=[];hpSource='fout';hpErr='De standaardlijst met warmtepompen kon niet worden geladen.';}
  rerenderHp();}
async function loadHpFromAccount(){if(storeMode!=='db')return;try{const d=await db.collection('data/users/'+uid).doc('hplist').get();

function rerenderHp(){if(tab==='res')renderPanel();}
// design heat loss as a straight line: zero at the loss-weighted indoor temperature
// improvement measures: per construction, the drop in heat loss when its U goes from the current value to the target
function computeAdvice(c){const R=P.settings.advice,map={};
  c.per.forEach(x=>x.c.lines.forEach(l=>{if(!l.cid||!DU_TYPES.has(l.type)||l.dT<=0||l.A<=0)return;const con=conById(l.cid);if(!con)return;
    const r=R[con.kind];if(!r||!(con.U>r.on)||!(r.to<con.U))return;
    const m=map[con.id]||(map[con.id]={con,rule:r,A:0,dW:0,rooms:new Set()});const d=l.A*(con.U-r.to)*l.dT;m.A+=l.A;m.dW+=d;m.rooms.add(x.room.name);}));
  return Object.values(map).sort((a,b)=>b.dW-a.dW);}
function adviceSaving(c,list){return(list||computeAdvice(c)).filter(a=>P.advSel[a.con.id]).reduce((s,a)=>s+a.dW,0);}
function lossLine(c,save){const S=P.settings,tot=c.total-(save||0);const w=c.per.reduce((a,x)=>a+Math.max(0,x.c.total),0);
  const tref=w>0?c.per.reduce((a,x)=>a+Math.max(0,x.c.total)*x.room.temp,0)/w:20;
  return{tref,te:S.te,at:t=>tot<=0||tref<=S.te?0:Math.max(0,tot*(tref-t)/(tref-S.te))/1000};}
function hpJudge(h,L){const te=P.settings.te,need=L.at(te),need10=L.at(10),max=hpAt(h,te,'max'),min10=hpAt(h,10,'min');
  const covers=max>=need-1e-9,mod=min10<=need10+1e-9;
  // bivalent point: where the max capacity line meets the loss line
  let biv=null;if(!covers){for(let t=te;t<=20;t+=0.1){if(hpAt(h,t,'max')>=L.at(t)){biv=t;break;}}}
  const score=covers?(max/need-1)+(mod?0:1):10+(need-max);
  return{need,need10,max,min10,covers,mod,biv,score,over:need>0?max/need-1:0,ex10:hpExtra(h,10)};}

        <span class="note">${esc(a.con.name)}: U ${nv(a.con.U,2)} → ${nv(a.rule.to,2)} W/m²K · ${fmt(a.A,1)} m² in ${[...a.rooms].map(esc).join(', ')} · ${fmt(pct,0)}% van het totaal</span>
        <label class="chk"><input type="checkbox" id="f-adv-${a.con.id}" data-f="advsel.${a.con.id}" ${on?'checked':''}> Meenemen in de berekening</label></div>`;});

    </tbody></table></div><p class="note">Richtwaarden: HR++ glas in een nieuw kozijn ca. U 1,1–1,4, triple glas ca. 0,7–0,9; spouwvulling ca. U 0,4–0,5; Rc 3,5 komt overeen met U ≈ 0,27, Rc 6 met U ≈ 0,16.</p>`;
  return h+`</div>`;}
function hpSectionHtml(c){
  const save=adviceSaving(c),L=lossLine(c,save),L0=save>0?lossLine(c):null;if(c.total<=0)return'';
  if(!hpList)return `<div class="sec"><h3>Warmtepomp</h3><p class="note">Lijst met warmtepompen laden…</p></div>`;
  const rows=hpList.map(h=>({h,j:hpJudge(h,L)})).sort((a,b)=>a.j.score-b.j.score);
  if(!hpSel||!hpList.some(h=>h.id===hpSel))hpSel=rows.length?rows[0].h.id:null;
  const cur=rows.find(r=>r.h.id===hpSel);

  if(hpErr)h+=`<div class="warnbox">${esc(hpErr)}</div>`;
  if(cur)h+=hpChartHtml(cur.h,cur.j,L,L0);
  h+=rows.map(({h:hp,j})=>`<button class="hprow ${hp.id===hpSel?'cur':''}" data-act="hpsel" data-h="${esc(hp.id)}" aria-pressed="${hp.id===hpSel}">
      <span class="hn">${esc(hp.merk)} ${esc(hp.model)}<small>${hp.aanvoer?'aanvoer '+nv(hp.aanvoer,0)+' °C · ':''}${esc(hp.bron)}</small></span>
      <span class="hk">${fmt(j.max,1)} kW</span>
      <span class="hs">${j.covers?`<span class="chip ok">✓ dekt ${nv(L.te,0)} °C${j.over>0.005?` (+${fmtW(j.over*100)}%)`:''}</span>`:`<span class="chip bad">⚠ tekort ${fmt(j.need-j.max,1)} kW${j.biv!=null?` · bijverwarming nodig onder ${fmt(j.biv,1)} °C`:''}</span>`}
      ${j.mod?`<span class="chip ok">✓ min. ${fmt(j.min10,1)} kW bij +10 °C</span>`:`<span class="chip bad">⚠ min. ${fmt(j.min10,1)} kW bij +10 °C: slaat vaak aan en af</span>`}${j.ex10?'<span class="chip">+10 °C doorgerekend</span>':''}</span></button>`).join('');
  h+=`<div class="row"><button class="btn small" data-act="hpexport">Lijst downloaden (.json)</button><button class="btn small" data-act="hpimport">Eigen lijst importeren</button>${hpSource==='eigen'?'<button class="btn small" data-act="hpreset">Standaardlijst terugzetten</button>':''}</div>
    <p class="note">${hpSource==='eigen'?'Je gebruikt je eigen lijst.':'Dit is de standaardlijst.'} Download de lijst, vul hem aan in een teksteditor en importeer hem weer. Per warmtepomp geef je het minimale en maximale vermogen bij een paar buitentemperaturen; daartussen rekent de app rechtlijnig door. De warmtepompen uit je Excel hebben gegevens bij −10 en +7 °C; de waarde bij +10 °C is doorgerekend. De voorbeelden met 'fictief' in de naam zijn verzonnen.</p></div>`;
  return h;}
function hpChartHtml(hp,j,L,L0){
  const W=380,H=230,ml=40,mr=14,mt=14,mb=32,x0=-10,x1=15;const te=L.te<x0?L.te:x0;
  const xs=t=>ml+(t-te)/(x1-te)*(W-ml-mr);
  let ymax=Math.max(L.at(te),L0?L0.at(te):0,hpAt(hp,x1,'max'),hpAt(hp,te,'max'))*1.1;const step=ymax<=4?1:ymax<=10?2:ymax<=20?4:5;ymax=Math.ceil(ymax/step)*step;
  const ys=v=>H-mb-(v/ymax)*(H-mt-mb);
  let o='';
  for(let v=0;v<=ymax+1e-9;v+=step)o+=`<line x1="${ml}" x2="${W-mr}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)" stroke-width="1"/><text x="${ml-6}" y="${ys(v)+3.5}" text-anchor="end">${nv(v,0)}</text>`;
  for(let t=Math.ceil(te/5)*5;t<=x1;t+=5)o+=`<text x="${xs(t)}" y="${H-mb+15}" text-anchor="middle">${t>0?'+':''}${t}</text>`;
  o+=`<text x="${(ml+W-mr)/2}" y="${H-4}" text-anchor="middle">buitentemperatuur °C</text><text x="${ml-6}" y="${mt-4}" text-anchor="end">kW</text>`;
  // check lines at design temperature and +10 °C
  [te,10].forEach(t=>o+=`<line x1="${xs(t)}" x2="${xs(t)}" y1="${mt}" y2="${H-mb}" stroke="var(--muted)" stroke-opacity=".35" stroke-dasharray="3 4"/>`);
  const N=50,ts=[...Array(N+1)].map((_,i)=>te+(x1-te)*i/N);
  const path=f=>ts.map((t,i)=>`${i?'L':'M'}${xs(t).toFixed(1)} ${ys(f(t)).toFixed(1)}`).join('');
  // capacity band between min and max
  o+=`<path d="${path(t=>hpAt(hp,t,'max'))}${ts.slice().reverse().map(t=>`L${xs(t).toFixed(1)} ${ys(hpAt(hp,t,'min')).toFixed(1)}`).join('')}Z" fill="var(--c-hp)" fill-opacity=".10"/>`;
  o+=`<path d="${path(t=>hpAt(hp,t,'max'))}" fill="none" stroke="var(--c-hp)" stroke-width="2.4" stroke-linejoin="round"/>`;
  o+=`<path d="${path(t=>hpAt(hp,t,'min'))}" fill="none" stroke="var(--c-hp)" stroke-width="2" stroke-dasharray="6 4"/>`;
  if(L0)o+=`<path d="${path(t=>L0.at(t))}" fill="none" stroke="var(--c-loss)" stroke-opacity=".4" stroke-width="2" stroke-dasharray="2 4"/>`;
  o+=`<path d="${path(t=>L.at(t))}" fill="none" stroke="var(--c-loss)" stroke-width="2.4"/>`;
  // the two check points
  const dot=(t,v,col)=>`<circle cx="${xs(t)}" cy="${ys(v)}" r="5" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`;
  o+=dot(te,L.at(te),'var(--c-loss)')+dot(te,j.max,'var(--c-hp)')+dot(10,L.at(10),'var(--c-loss)')+dot(10,j.min10,'var(--c-hp)');
  // direct labels at the right end
  o+=`<text x="${W-mr}" y="${ys(hpAt(hp,x1,'max'))-6}" text-anchor="end" style="fill:var(--ink);font-weight:600">max</text><text x="${W-mr}" y="${ys(hpAt(hp,x1,'min'))-6}" text-anchor="end" style="fill:var(--ink);font-weight:600">min</text>`;
  o+=`<line id="hp-x" y1="${mt}" y2="${H-mb}" stroke="var(--ink)" stroke-opacity=".5" visibility="hidden"/><rect id="hp-hit" x="${ml}" y="${mt}" width="${W-ml-mr}" height="${H-mt-mb}" fill="transparent"/>`;
  window.__hpChart={hp,L,te,x1,ml,mr,W,H};
  return `<div class="chartleg"><span><i style="background:var(--c-loss)"></i>Warmteverlies${L0?" na maatregelen":""}</span>${L0?`<span><i style="background:repeating-linear-gradient(90deg,var(--c-loss) 0 2px,transparent 2px 6px);opacity:.6"></i>nu</span>`:""}<span><i style="background:var(--c-hp)"></i>${esc(hp.merk)} ${esc(hp.model)} max</span><span><i style="background:repeating-linear-gradient(90deg,var(--c-hp) 0 6px,transparent 6px 9px)"></i>min</span></div>
    <div class="chart" id="hpchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Warmteverlies en vermogen van ${esc(hp.merk)} ${esc(hp.model)} tegen de buitentemperatuur">${o}</svg><div class="tip" id="hp-tip" hidden></div></div>
    <div class="tablewrap"><table class="calc"><thead><tr><th>Buiten</th><th>Warmteverlies kW</th><th>Max kW</th><th>Min kW</th></tr></thead><tbody>
    ${[te,-5,0,5,10].filter((t,i,a)=>a.indexOf(t)===i).map(t=>`<tr><td>${t>0?'+':''}${nv(t,0)} °C</td><td>${fmt(L.at(t),2)}</td><td>${fmt(hpAt(hp,t,'max'),2)}${hpExtra(hp,t)?'*':''}</td><td>${fmt(hpAt(hp,t,'min'),2)}${hpExtra(hp,t)?'*':''}</td></tr>`).join('')}
    </tbody></table></div>${[te,10].some(t=>hpExtra(hp,t))?'<p class="note">* doorgerekend buiten de opgegeven meetpunten</p>':''}`;}
function bindHpChart(){const box=$('hpchart'),C=window.__hpChart;if(!box||!C)return;const svgEl=box.querySelector('svg'),tip=$('hp-tip'),xl=svgEl.querySelector('#hp-x');

function selRoom(){return sel&&getRoom(sel.r);}

function applyField(el,final){
  const f=el.dataset.f;if(!f)return;const parts=f.split('.');const v=el.value;const room=selRoom();let changed=false;
  if(undoArmed){pushUndo();undoArmed=false;}
  switch(parts[0]){
    case'room':{if(!room)return;const k=parts[1];
      if(k==='kind'){room.kind=['trap','vide'].includes(v)?v:'normaal';if(room.kind!=='normaal'&&!spans(room)){const nf=P.floors[floorIdx(room.floorId)+1];if(nf){room.spanTo=nf.id;room.height=r3(room.height*2);}}changed=true;break;}
      if(k==='spanTo'){const was=spans(room);room.spanTo=v||null;if(!spans(room))room.spanTo=null;else if(!was){const l=levelsOf(room);room.height=r3(room.height*(l[1]-l[0]+1));}changed=true;break;}
      if(k==='name'){room.name=v;changed=true;}else{const n=num(v);if(n==null)return;if(k==='height'&&n<=0)return;if((k==='sup'||k==='ext')&&n<0)return;room[k]=n;changed=true;}break;}
    case'seg':{const sg=selSeg();if(!sg)return;if(parts[1]==='adjT'){const n=num(v);if(n==null)return;sg.adjT=n;}else sg[parts[1]]=v;changed=true;break;}
    case'cut':{if(!final)return;const r=room;const w=r.walls[sel.w];const ci=+parts[1];let n=num(v);if(n==null)return;const L=edge(r,sel.w).L;
      const lo=(ci>0?w.cuts[ci-1]:0)+0.02,hi=(ci<w.cuts.length-1?w.cuts[ci+1]:L)-0.02;n=Math.max(lo,Math.min(hi,n));w.cuts[ci]=r3(n);changed=true;break;}
    case'op':{const sg=selSeg();const o=sg&&sg.openings.find(o=>o.id===parts[1]);if(!o)return;const k=parts[2];if(k==='name'||k==='cid')o[k]=v;else{const n=num(v);if(n==null||n<0)return;o[k]=n;}changed=true;break;}
    case'roof':{if(!room)return;const r=room.roof,k=parts[1];
      if(k==='pitch'||k==='knee'){const n=num(v);if(n==null||n<0)return;if(k==='pitch'&&(n<1||n>80))return;r[k]=n;changed=true;break;}
      if(k==='edge'){r.edge=Math.max(0,Math.min(room.pts.length-1,parseInt(v,10)||0));changed=true;break;}
      if(k==='type'||k==='low'){r[k]=v;changed=true;break;}}
    // falls through for cid / adj / t, which work the same as floor and ceiling
    case'floor':case'ceil':{if(!room)return;const s=room[parts[0]];if(parts[1]==='t'){const n=num(v);if(n==null)return;s.t=n;}else s[parts[1]]=v;changed=true;break;}
    case'con':{const c=conById(parts[1]);if(!c)return;const k=parts[2];
      if(k==='name'||k==='kind'||k==='color')c[k]=v;else if(k==='inner')c.inner=el.checked;else if(k==='mode')c.mode=v==='lagen'?'lagen':'U';
      else if(k==='U'){if(c.mode==='lagen')return;const n=num(v);if(n==null||n<=0)return;c.U=n;}
      else if(k==='Rc'){if(c.mode==='lagen')return;const n=num(v);if(n==null||n<0)return;c.U=Math.round(10000/(RS[c.kind][0]+n+rseOf(c)))/10000;}
      syncU(c);changed=true;break;}
    case'lay':{const c=conById(parts[1]);const l=c&&c.layers.find(x=>x.id===parts[2]);if(!l)return;const k=parts[3];
      if(k==='mid'||k==='vent')l[k]=v;else if(k==='mixmid'){if(l.mix)l.mix.mid=v;}
      else{const n=num(v);if(n==null||n<0)return;if(k==='d')l.d=n;else if(k==='mixpct'){if(n>100||!l.mix)return;l.mix.pct=n;}}
      syncU(c);changed=true;break;}
    case'mat':{const m=matById(parts[1]);if(!m)return;const k=parts[2];
      if(k==='name'||k==='color')m[k]=v;else if(k==='type')m.type=['lambda','R','spouw'].includes(v)?v:'lambda';else{const n=num(v);if(n==null||n<0)return;if(k==='lambda'&&n===0)return;m[k]=n;}
      P.constructions.forEach(c=>syncU(c));changed=true;break;}
    case'set':{const k=parts[1];if(k==='ventSys'||k==='infMode'){P.settings[k]=v;changed=true;break;}const n=num(v);if(n==null)return;
      if((k==='eta'&&(n<0||n>1))||((k==='qv10'||k==='fInf')&&n<0))return;if((k==='snap'||k==='height')&&n<=0)return;if(k==='maxWall'&&n<0)return;P.settings[k]=n;changed=true;break;}
    case'proj':{P.name=v;changed=true;break;}
    case'tr':{const t=(P.transfers||[]).find(x=>x.id===parts[1]);if(!t)return;const k=parts[2];
      if(k==='from'||k==='to'){if(!getRoom(v))return;t[k]=v;}else{const n=num(v);if(n==null||n<0)return;t.q=n;}changed=true;break;}
    case'advsel':{if(el.checked)P.advSel[parts[1]]=true;else delete P.advSel[parts[1]];changed=true;break;}
    case'adv':{const r=P.settings.advice[parts[1]];if(!r)return;const n=num(v);if(n==null||n<=0)return;r[parts[2]]=n;changed=true;break;}
    case'em':{const em=selEm();if(!em)return;const k=parts[1];
      if(k==='name')em.name=v;else if(k==='boost')em.boost=el.checked;else if(k==='kind'){if(!EM_KINDS[v]||v==='vv')return;em.kind=v;em.n=EM_N[v];}
      else if(k==='cover'){if(!VV_COVER[v])return;em.cover=v;}else if(k==='spacing')em.spacing=[10,15,20].includes(+v)?+v:15;
      else if(k==='pipe'){if(parts[2]==='mat'){if(!PIPES[v])return;em.pipe.mat=v;if(!PIPES[v].d[em.pipe.dn])em.pipe.dn=v==='koper'?'15':v==='pex'?'16':'1/2"';}else{if(!PIPES[em.pipe.mat].d[v])return;em.pipe.dn=v;}}
      else{const n=num(v);if(n==null||n<0)return;if(k==='n'&&(n<0.8||n>2))return;if(k==='boostPct'&&n>300)return;em[k]=n;}changed=true;break;}
    case'vr':{const r=getRoom(parts[1]);if(!r)return;const n=num(v);if(n==null||n<0)return;r[parts[2]]=n;changed=true;break;}
    case'fl':{const f=P.floors.find(x=>x.id===parts[1]);if(!f)return;f.name=v;renderFloorbar();changed=true;break;}
  }
  if(!changed)return;markDirty();renderCanvas();if(final)schedulePanel();else liveUpdate();

function act(a,b){

    case'delem':deleteSelection();break;
    case'addtr':{if(P.rooms.length<2)return;pushUndo();
      // sensible default: from a room with air to spare to a room that is short of air
      const bal=P.rooms.map(r=>({r,a:airBalance(r)}));const from=(bal.find(x=>x.a.surplus>0)||bal.find(x=>x.r.sup>0)||bal[0]).r;
      const to=(bal.find(x=>x.r!==from&&x.a.rest>0)||bal.find(x=>x.r!==from&&x.r.ext>0)||bal.find(x=>x.r!==from)).r;
      const q=Math.max(5,Math.round(Math.min(airBalance(from).surplus||25,airBalance(to).rest||25)));

    case'deltr':{pushUndo();P.transfers=P.transfers.filter(t=>t.id!==b.dataset.t);markDirty();renderAll();break;}
    case'gotab':tab=b.dataset.tab;confirmDel=false;renderPanel();pbody.scrollTop=0;break;
    case'selroom':case'selseg':{const r=getRoom(b.dataset.r);if(!r)return;if(r.floorId!==curFloor){curFloor=r.floorId;try{localStorage.setItem('wvt.floor.'+P.id,curFloor);}catch(_){}}
      sel=a==='selroom'?{t:'room',r:r.id}:{t:'seg',r:r.id,w:+b.dataset.w,s:+b.dataset.s};tab='sel';renderAll();break;}
    case'addfloor':addFloor();break;
    case'floormove':{const i=floorIdx(b.dataset.f),j=i+(+b.dataset.dir);if(i<0||j<0||j>=P.floors.length)return;pushUndo();[P.floors[i],P.floors[j]]=[P.floors[j],P.floors[i]];markDirty();renderAll();break;}
    case'delfloor':{const i=floorIdx(b.dataset.f);if(i<0||P.floors.length<2||P.rooms.some(r=>r.floorId===b.dataset.f))return;pushUndo();P.floors.splice(i,1);if(curFloor===b.dataset.f)curFloor=P.floors[Math.max(0,i-1)].id;markDirty();renderAll();break;}
    case'delroom':deleteSelection();break;
    case'gocon':tab='con';conFocus=b.dataset.c||null;renderPanel();break;
    case'addcut':{const inp=$('f-newcut');const n=num(inp&&inp.value!==''?inp.value:inp&&inp.placeholder);if(n==null||!room)return;addCut(room,sel.w,n);break;}
    case'splitmid':{if(!room)return;const bb=bounds(room,sel.w);addCut(room,sel.w,r3((bb[sel.s]+bb[sel.s+1])/2));break;}
    case'delcut':if(room)removeCut(room,sel.w,+b.dataset.c);break;
    case'addop':{const sg=selSeg();if(!sg)return;pushUndo();sg.openings.push(opening('Raam '+(sg.openings.length+1),1.2,1.4,defaultCid('raam')));markDirty();renderAll();break;}
    case'delop':{const sg=selSeg();if(!sg)return;pushUndo();sg.openings=sg.openings.filter(o=>o.id!==b.dataset.o);markDirty();renderAll();break;}
    case'addcon':{pushUndo();const k=b.dataset.kind;const c={id:rid(),name:'Nieuwe '+KINDS[k].toLowerCase(),kind:k,U:k==='raam'?1.8:0.25,color:PALETTE[P.constructions.length%PALETTE.length],mode:k==='raam'?'U':'lagen',inner:false,layers:[]};P.constructions.push(c);conFocus=c.id;markDirty();renderAll();setTimeout(()=>{const el=$('f-con-'+c.id+'-n');if(el){el.focus();el.select();}},0);break;}
    case'dupcon':{const src=conById(b.dataset.c);if(!src)return;pushUndo();const c=clone(src);c.id=rid();c.name=src.name+' (kopie)';c.color=PALETTE[P.constructions.length%PALETTE.length];c.layers.forEach(l=>l.id=rid());P.constructions.push(c);conFocus=c.id;markDirty();renderAll();break;}
    case'togglecon':conOpen=conOpen===b.dataset.c?null:b.dataset.c;renderPanel();break;
    case'addlayer':{const c=conById(b.dataset.c);if(!c)return;pushUndo();const def=P.materials.find(m=>m.id==='m-glaswol')||P.materials.find(m=>m.type==='lambda')||P.materials[0];
      c.layers.push({id:rid(),mid:def?def.id:'',d:100,vent:'niet',mix:null});syncU(c);markDirty();renderAll();break;}
    case'laydel':case'laymove':case'addmix':case'delmix':{const c=conById(b.dataset.c);const i=c?c.layers.findIndex(l=>l.id===b.dataset.l):-1;if(i<0)return;pushUndo();const l=c.layers[i];
      if(a==='laydel')c.layers.splice(i,1);
      else if(a==='laymove'){const j=i+(+b.dataset.dir);if(j<0||j>=c.layers.length)return;[c.layers[i],c.layers[j]]=[c.layers[j],c.layers[i]];}
      else if(a==='addmix'){const mm=P.materials.find(m=>m.id==='m-hout')||P.materials.find(m=>m.type==='lambda');l.mix={mid:mm?mm.id:'',pct:12};}
      else l.mix=null;
      syncU(c);markDirty();renderAll();break;}
    case'addmat':{pushUndo();const m={id:rid(),name:'Nieuw materiaal',type:'lambda',lambda:0.04,R:0,color:'#BBBBBB'};P.materials.push(m);markDirty();renderAll();setTimeout(()=>{const el=$('f-mat-'+m.id+'-n');if(el){el.focus();el.select();}},0);break;}
    case'delmat':{pushUndo();P.materials=P.materials.filter(m=>m.id!==b.dataset.m);markDirty();renderAll();break;}
    case'delcon':{pushUndo();P.constructions=P.constructions.filter(c=>c.id!==b.dataset.c);markDirty();renderAll();break;}
    case'csv':exportCsv();break;
    case'newproj':{const p=emptyProject('Nieuw project');all[p.id]=p;openProject(p.id);tab='set';renderAll();toast('Leeg project aangemaakt. De constructies van het voorbeeld zijn meegekopieerd.');markDirty();break;}
    case'dupproj':{const p=clone(P);p.id='p'+rid();p.name=P.name+' (kopie)';p.example=false;all[p.id]=p;openProject(p.id);markDirty();renderAll();toast('Kopie gemaakt.');break;}
    case'openproj':openProject(b.dataset.p);renderAll();break;
    case'delproj':confirmDel=true;renderPanel();break;
    case'delproj-no':confirmDel=false;renderPanel();break;
    case'delproj-yes':{confirmDel=false;const id=P.id;delete all[id];removeRemote(id);const next=Object.values(all).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];openProject(next.id);saveLocal();renderAll();toast('Project verwijderd.');break;}
    case'import':$('file-in').click();break;
    case'export':exportJson();break;
    case'export-hljs':exportHeatlossjs();break;
    case'advrules':advRulesOpen=!advRulesOpen;renderPanel();break;
    case'hpsel':hpSel=b.dataset.h;renderPanel();break;
    case'hpexport':saveFile('warmtepompen.json',JSON.stringify({versie:1,toelichting:"Per warmtepomp: minimaal en maximaal verwarmingsvermogen (kW) bij een buitentemperatuur (°C), bij de aanvoertemperatuur in 'aanvoer'. Minimaal twee punten, bij voorkeur -10 en +7 of +10 °C. Kopieer een blok om er een toe te voegen.",warmtepompen:hpList||[]},null,2));break;
    case'hpimport':$('file-in').click();break;
    case'hpreset':{try{localStorage.removeItem(HP_LS);}catch(_){}if(storeMode==='db'){db.collection('data/users/'+uid).doc('hplist').delete().catch(()=>{});}hpList=null;hpErr='';loadHpList();toast('Standaardlijst met warmtepompen teruggezet.');break;}
  }
}
$('proj-sel').onchange=e=>{openProject(e.target.value);renderAll();};
function openProject(id){if(!all[id])return;P=normalizeProject(all[id]);all[id]=P;sel=null;curFloor=null;undoStack=[];redoStack=[];drawPts=[];try{localStorage.setItem(LS_LAST,id);}catch(_){}requestAnimationFrame(fit);}

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg,withUndo){const t=$('toast');t.innerHTML=`<span>${esc(msg)}</span>${withUndo?'<button id="toast-undo">Ongedaan maken</button>':''}`;t.hidden=false;
  if(withUndo)$('toast-undo').onclick=()=>{undo();t.hidden=true;};clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,withUndo?6000:3500);}

/* ---------- import / export ---------- */
let downloads=null;
async function saveFile(filename,data){
  if(downloads){try{await downloads.save({filename,data});return;}catch(err){if(err&&err.code==='declined')return;}}
  try{const type=/\.csv$/i.test(filename)?'text/csv;charset=utf-8':'application/json';
    const url=URL.createObjectURL(new Blob([/\.csv$/i.test(filename)?'\uFEFF'+data:data],{type}));
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);return;}catch(_){}
  try{await navigator.clipboard.writeText(data);toast('Downloaden kan hier niet. De inhoud staat op je klembord.');}catch(_){toast('Downloaden is in deze weergave niet beschikbaar.');}}
function exportJson(){saveFile(safeName(P.name)+'.json',JSON.stringify(P,null,1));}
function exportCsv(){const c=calcAll();const rows=[['Ruimte','Temperatuur C','Vloeroppervlak m2','Transmissie W','Ventilatie W','Infiltratie W','Totaal W','W/m2']];
  c.per.forEach(x=>rows.push([x.room.name,x.room.temp,x.c.Af.toFixed(2),x.c.trans.toFixed(0),x.c.vent.toFixed(0),x.c.inf.toFixed(0),x.c.total.toFixed(0),x.c.Af?(x.c.total/x.c.Af).toFixed(0):'']));
  rows.push(['Totaal','','','','','',c.total.toFixed(0),'']);
  saveFile(safeName(P.name)+' - warmteverlies.csv',rows.map(r=>r.map(v=>{const s=String(v);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(';')).join('\n'));}
/* ---------- heatlossjs (github.com/trystanLea/heatlossjs) ---------- */
function toHeatlossjs(){
  const S=P.settings;const T={external:S.te,ground:S.tGround,unheated:S.tUnheated};
  const element_type={},elements=[],rooms={},typeMap={},names={};
  const taken=new Set(['external','ground','unheated','buurwoning']);
  P.rooms.forEach(r=>{const n=(r.name||'').trim()||'Ruimte';let k=n,i=2;while(taken.has(k))k=n+' '+(i++);taken.add(k);names[r.id]=k;});
  const bnd=(type,t)=>{if(type==='grond')return'ground';if(type==='onverwarmd')return'unheated';
    if(type==='buurwoning'){T.buurwoning=S.tNeighbour;return'buurwoning';}if(type==='temp'){const k='vast '+nv(t,1)+' C';T[k]=t;return k;}return'external';};
  const tname=(cid,type)=>{const c=conById(cid);const du=!!(c&&DU_TYPES.has(type)&&S.dU>0);const k=(c?c.name:'Geen constructie')+(du?' (+ΔU)':'');
    if(!element_type[k]){const u=Math.round((c?c.U+(du?S.dU:0):0)*10000)/10000;element_type[k]={uvalue:u};typeMap[k]={cid:c?c.id:'',du:du?S.dU:0,u};}return k;};
  const add=(nm,el,boundary)=>{elements.push(el);rooms[nm].elements.push({id:elements.length-1,boundary});return elements.length-1;};
  P.rooms.forEach(r=>{
    const R=roofOf(r),Af=Math.abs(polyArea(r.pts)),V=roomVolume(r),nm=names[r.id],h=R?(Af>0?r3(V/Af):r.height):r.height,dTe=r.temp-S.te;
    // heatlossjs only knows air changes against the outside temperature (0,33 Wh/m³K): express ventilation + infiltration as an equivalent ach
    const cr=calcRoom(r);let ach=0;if(V>0&&dTe!==0)ach=(cr.vent+cr.inf)/(0.33*V*dTe);
    rooms[nm]={temperature:r.temp,area:r3(Af),height:h,air_change_an_hour:Math.round(ach*10000)/10000,elements:[],radiators:[],ufh:[]};
    (r.emitters||[]).forEach(em=>{if(em.kind==='rad'||em.kind==='conv')rooms[nm].radiators.push({name:em.name+(em.boost?' (met boosters)':''),heat50k:Math.round(em.p*(em.boost?1+(em.boostPct||0)/100:1)),model:'pow'});
      else if(em.kind==='vv')rooms[nm].ufh.push({name:em.name,area:r3(emArea(em)),flooring:(VV_COVER[em.cover]||VV_COVER.tegels)[1]});});
    r.pts.forEach((_,i)=>{const w=r.walls[i],b=bounds(r,i),nb=neighbourIntervals(r,i);
      w.segs.forEach((sg,j)=>{const s0=b[j],s1=b[j+1],len=s1-s0;if(len<=1e-4)return;
        let parts;
        if(sg.adj==='auto')parts=wallParts(r,i,s0,s1,nb,R).map(p=>p.room?{len:p.len,A:p.A,type:'ruimte',bnd:names[p.room.id]}:{len:p.len,A:p.A,type:'buiten',bnd:'external'});
        else parts=[{len,A:wallArea(r,edge(r,i),s0,s1,R),type:sg.adj,bnd:bnd(sg.adj,sg.adjT)}];
        const opType=sg.adj==='auto'?'buiten':sg.adj,opBnd=sg.adj==='auto'?'external':bnd(sg.adj,sg.adjT);
        const Aop=sg.openings.reduce((a,o)=>a+Math.max(0,o.w*o.h),0);
        // width × height only works for straight-topped walls; under a sloped roof every piece goes as a net area
        const host=parts.find(p=>p.type===opType)||parts[0];const simple=!R&&!spans(r)&&(!host||Aop<=host.len*h+1e-9);
        if(!simple){let rem=Aop;parts.slice().sort((a,b)=>(b.type===opType)-(a.type===opType)).forEach(p=>{const d=Math.min(p.A,rem);p.A-=d;rem-=d;});}
        parts.forEach(p=>{const el={type:tname(sg.cid,p.type),orientation:''};if(simple){el.width=r3(p.len);el.height=h;}else el.area=r3(p.A);p.idx=add(nm,el,p.bnd);});
        sg.openings.forEach(o=>{const el={type:tname(o.cid,opType),orientation:'',width:o.w,height:o.h};if(simple&&host)el.subtractfrom=host.idx;add(nm,el,opBnd);});
      });});
    transLines(r).lines.filter(l=>l.group==='floor'||l.group==='ceil'||l.group==='roof').forEach(l=>{const s=r[l.group];if(!s||l.A<1e-4)return;
      add(nm,{type:tname(s.cid,s.adj),orientation:'',area:r3(l.A)},bnd(s.adj,s.t));});
  });
  return{project_name:P.name,degreedays:2900,heating_MWT:(S.twSup+S.twRet)/2,heatpump_flow_rate:12,T,element_type,elements,rooms,
    house:{},JK:50,cop_calculation_method:'ecodan',heatpump_capacity:5,solver_running:false,
    tekentafel:{version:1,exported:new Date().toISOString(),names,typeMap,project:clone(P)}};
}
function exportHeatlossjs(){saveFile('heatlossjs_'+safeName(P.name)+'.json',JSON.stringify(toHeatlossjs(),null,1));}
function guessKind(n){n=n.toLowerCase();if(/window|door|raam|deur|glas|glaz/.test(n))return'raam';if(/floor|vloer/.test(n))return'vloer';if(/roof|ceiling|loft|dak|plafond/.test(n))return'dak';return'wand';}
function importHeatlossjs(o){
  const meta=o.tekentafel;
  if(meta&&meta.project){const p=normalizeProject(clone(meta.project));if(!p)throw 0;p.id='p'+rid();p.example=false;p.updatedAt=Date.now();let n=0;const T=o.T||{},S=p.settings;
    [['external','te'],['ground','tGround'],['unheated','tUnheated'],['buurwoning','tNeighbour']].forEach(([k,s])=>{const v=+T[k];if(T[k]!=null&&Number.isFinite(v)&&v!==S[s]){S[s]=v;n++;}});
    Object.entries(meta.names||{}).forEach(([id,name])=>{const r=p.rooms.find(x=>x.id===id),hr=o.rooms&&o.rooms[name];const v=hr?+hr.temperature:NaN;if(r&&Number.isFinite(v)&&v!==r.temp){r.temp=v;n++;}});
    Object.entries(meta.typeMap||{}).forEach(([k,m])=>{const et=o.element_type&&o.element_type[k];const u=et?+et.uvalue:NaN;if(!Number.isFinite(u)||Math.abs(u-m.u)<0.0005)return;
      const c=p.constructions.find(x=>x.id===m.cid);if(!c)return;c.mode='U';c.U=Math.max(0.0001,Math.round((u-m.du)*10000)/10000);n++;});
    all[p.id]=p;openProject(p.id);markDirty();renderAll();
    toast(n?`Tekening teruggeladen. ${n} waarde${n>1?'n':''} uit heatlossjs overgenomen.`:'Tekening teruggeladen uit het heatlossjs-bestand.');return;}
  const types=Object.entries(o.element_type||{});if(!types.length)throw 0;
  pushUndo();types.forEach(([name,v],i)=>{if(P.constructions.some(c=>c.name===name))return;P.constructions.push({id:rid(),name,kind:guessKind(name),U:+v.uvalue||0,color:PALETTE[(P.constructions.length+i)%PALETTE.length],mode:'U',inner:/internal|party/i.test(name),layers:[]});});
  markDirty();tab='con';renderAll();
  toast(`${types.length} constructietypen uit heatlossjs toegevoegd. Dit bestand heeft geen tekening, dus ruimtes en wanden zijn niet overgenomen.`);
}
function safeName(s){return String(s||'project').replace(/[\\/:*?"<>|]+/g,'-').slice(0,80);}
$('file-in').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{let o;try{o=JSON.parse(rd.result);}catch(_){toast('Dit bestand is geen geldig JSON-bestand.');return;}
    if(o&&Array.isArray(o.warmtepompen)){const l=hpValid(o.warmtepompen);if(!l.length){toast('Geen bruikbare warmtepompen gevonden. Elke warmtepomp heeft minstens twee punten met buiten en max nodig.');return;}
      hpList=l;hpSource='eigen';hpErr='';saveHpOwn(l);tab='res';renderPanel();toast(`${l.length} warmtepomp${l.length>1?'en':''} geïmporteerd.`);return;}
    if(o&&o.rooms&&typeof o.rooms==='object'&&!Array.isArray(o.rooms)){try{importHeatlossjs(o);}catch(_){toast('Dit heatlossjs-bestand kon niet worden gelezen.');}return;}
    try{const p=normalizeProject(o);if(!p)throw 0;p.id='p'+rid();p.example=false;all[p.id]=p;openProject(p.id);markDirty();renderAll();toast(`“${p.name}” geïmporteerd.`);}catch(_){toast('Dit bestand is geen geldig project (.json uit deze app).');}};
  rd.readAsText(f);e.target.value='';});

/* ---------- persistence ---------- */
let db=null,uid=null,storeMode='local',saveTimer=null,saving=false,saveAgain=false,lastErr=null;
function storeNote(){return storeMode==='db'?'Projecten worden automatisch opgeslagen in je Claude-account, alleen zichtbaar voor jou.':storeMode==='loading'?'Verbinden met je opslag…':'Projecten worden alleen in deze browser bewaard. Exporteer een .json als reservekopie.';}
function setStatus(txt,cls){const s=$('status');s.textContent=txt;s.className='pill'+(cls?' '+cls:'');}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(all));}catch(_){}}
function loadLocal(){try{const raw=localStorage.getItem(LS_KEY);if(!raw)return{};const o=JSON.parse(raw);const out={};Object.values(o||{}).forEach(p=>{const n=normalizeProject(p);if(n)out[n.id]=n;});return out;}catch(_){return{};}}
function markDirty(noStamp){if(!P)return;if(!noStamp){P.updatedAt=Date.now();}P.example=false;all[P.id]=P;setStatus('Wijzigingen…');clearTimeout(saveTimer);saveTimer=setTimeout(flush,900);}
async function flush(){saveLocal();if(storeMode!=='db'){setStatus(storeMode==='loading'?'Opgeslagen in browser':'Opgeslagen in deze browser','ok');return;}
  if(saving){saveAgain=true;return;}saving=true;const p=P;
  try{setStatus('Opslaan…');await db.collection('data/users/'+uid).doc(p.id).set({name:p.name,updatedAt:p.updatedAt||Date.now(),project:JSON.parse(JSON.stringify(p))});setStatus('Opgeslagen','ok');lastErr=null;}
  catch(err){lastErr=err;setStatus(err&&err.code==='quota_exceeded'?'Opslag vol':'Niet opgeslagen in account','warn');}
  finally{saving=false;if(saveAgain){saveAgain=false;flush();}}}
async function removeRemote(id){if(storeMode!=='db')return;try{await db.collection('data/users/'+uid).doc(id).delete();}catch(_){}}
function withTimeout(pr,ms){return Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))]);}
async function initStore(){
  const c=window.claude;if(!c||typeof c.use!=='function'){storeMode='local';setStatus('Opgeslagen in deze browser','ok');return;}
  storeMode='loading';setStatus('Verbinden…');
  c.use('downloads').then(d=>{downloads=d;}).catch(()=>{});
  try{
    const [d,u]=await Promise.all([c.use('db'),c.use('user')]);
    const id=u?await u.id():null;
    if(!d||!id){storeMode='local';setStatus('Opgeslagen in deze browser','ok');if(tab==='set')renderPanel();return;}
    db=d;uid=id;
    const snap=await withTimeout(db.collection('data/users/'+uid).get(),10000);
    const remote={};snap.docs.forEach(doc=>{const data=doc.data();const p=data&&normalizeProject(clone(data.project));if(p){p.id=doc.id;remote[p.id]=p;}});
    const toUpload=[];
    // drop untouched example when the account already has projects
    if(Object.keys(remote).length){Object.values(all).forEach(p=>{if(p.example&&!p.updatedAt)delete all[p.id];});}
    Object.values(remote).forEach(p=>{const l=all[p.id];if(!l||(p.updatedAt||0)>=(l.updatedAt||0))all[p.id]=p;});
    Object.values(all).forEach(p=>{const r=remote[p.id];if(!r||(p.updatedAt||0)>(r.updatedAt||0)){if(!(p.example&&!p.updatedAt))toUpload.push(p);}});
    storeMode='db';
    if(!all[P.id]){let last=null;try{last=localStorage.getItem(LS_LAST);}catch(_){}const next=all[last]||Object.values(all).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];
      if(next){openProject(next.id);}else{const ex=exampleProject();all[ex.id]=ex;openProject(ex.id);}}
    else if(all[P.id]!==P){P=normalizeProject(all[P.id]);all[P.id]=P;validateSel();}
    saveLocal();
    for(const p of toUpload){try{await db.collection('data/users/'+uid).doc(p.id).set({name:p.name,updatedAt:p.updatedAt||Date.now(),project:JSON.parse(JSON.stringify(p))});}catch(_){}}
    setStatus('Opgeslagen in account','ok');renderAll();loadHpFromAccount();
  }catch(err){storeMode='local';setStatus(err&&err.code==='timeout'?'Account niet bereikbaar · lokaal opgeslagen':'Opgeslagen in deze browser',err&&err.code==='timeout'?'warn':'ok');if(tab==='set')renderPanel();}
}

/* ---------- boot ---------- */
all=loadLocal();
let last=null;try{last=localStorage.getItem(LS_LAST);}catch(_){}
if(!Object.keys(all).length){const ex=exampleProject();all[ex.id]=ex;}
P=all[last]||Object.values(all).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];
setTool('select');renderAll();requestAnimationFrame(fit);
initStore();loadHpList();
})();
