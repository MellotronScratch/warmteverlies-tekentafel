# Zet de site na elke push naar main op de eigen hosting (FTPS, met lftp).
# Inloggegevens staan als repository secrets in GitHub (Settings → Secrets and variables → Actions), nooit in de repo:
#   FTP_SERVER    naam van de FTP-server van de hoster (zonder ftp:// en zonder / erachter)
#   FTP_USERNAME
#   FTP_PASSWORD
#   FTP_DIR       map op de server, bijv. public_html/ (of ./ als je direct in de webroot uitkomt)
# Zonder FTP_SERVER slaat de workflow het uitrollen over.
# Het FTP-certificaat van de hoster is zelf ondertekend: alleen dat ene certificaat wordt vertrouwd, op zijn
# vingerafdruk (FTP_CERT). Vernieuwt de hoster het certificaat, dan stopt het uitrollen met "certificate is NOT
# trusted" en de nieuwe vingerafdruk; zet die dan hieronder.
# De handleiding (warmtepomptekentafel.nl/handleiding/) en sitemap.xml maakt tools/handleiding.mjs bij het uitrollen
# uit README.md en docs/*.md; ze staan niet in git.
# Bestanden die niet in de repo staan (zoals api/config.php) worden niet overschreven of verwijderd.
# De acties van GitHub staan op een vaste commit (met de versie erachter): een tag kan later naar andere code wijzen.
name: Uitrollen naar hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.FTP_SERVER != ''
        with:
          fetch-depth: 0 # git history for the lastmod dates in sitemap.xml
      - name: Handleiding en sitemap maken
        if: env.FTP_SERVER != ''
        run: |
          npm install --no-save --no-package-lock --silent marked@15.0.12
          node tools/handleiding.mjs
          # version behind scripts and stylesheet, so a browser with an old copy fetches the new one
          V=${GITHUB_SHA::8}
          sed -i -E "s#(src=\"js/[a-z0-9]+\.js|href=\"css/app\.css)\"#\1?v=$V\"#g" index.html
          grep -c "?v=$V" index.html
      # lftp (het uploadprogramma) zit niet standaard op de runner. De pakketservers van Ubuntu haperen soms even:
      # dan een paar keer opnieuw proberen in plaats van de hele deploy te laten mislukken.
      - name: Installeer lftp
        if: env.FTP_SERVER != ''
        run: |
          for i in 1 2 3 4; do
            sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get -o Acquire::Retries=3 install -y -qq lftp && break
            echo "Poging $i mislukt, over 20 seconden opnieuw"
            sleep 20
          done
          command -v lftp
      # Elk bestand gaat eerst onder een tijdelijke naam en wordt dan in één keer hernoemd (xfer:use-temp-file), zodat een
      # bezoeker nooit een half geschreven script krijgt. index.html gaat als laatste: pas dan verwijst de pagina naar de
      # nieuwe scripts, als die er al staan.
      - name: Uploaden
        if: env.FTP_SERVER != ''
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          FTP_CERT: '9D:C7:0E:76:4C:D7:1C:BD:CA:76:F9:DB:AD:3F:D1:2C:A7:DA:C8:13'
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate/$FTP_CERT no;
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            set xfer:use-temp-file yes;
            open --env-password -u \"$FTP_USERNAME\" \"$FTP_SERVER\";
            mirror --reverse --verbose --parallel=3 -x '^\.git' -x '^\.prettierrc\.json$' -x '^tools/' -x '^docs/' -x '^node_modules/' -x '^index\.html$' . \"${FTP_DIR:-./}\";
            put -O \"${FTP_DIR:-./}\" index.html
          "
